<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offer — Horizontal Overflow (broken)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; }
    .wrap { padding: 16px; }
    #heroTitle { font-size: 28px; line-height: 1.2; margin: 8px 0 16px; }
    /* BROKEN: a fixed 1200px-wide element forces horizontal scroll on a 390px mobile
       viewport, but still fits inside the 1440px desktop viewport (so overflow is a
       mobile-only regression here). */
    #overflowOffender { width: 1200px; height: 40px; background: repeating-linear-gradient(90deg,#f66 0 20px,#fff 20px 40px); }
    #evidenceScreenshot { width: 100%; max-width: 480px; aspect-ratio: 16 / 10; background: #ddd; }
    #personalizedVideoFrame { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; background: #222; margin-top: 16px; }
    #purchaseControls { margin-top: 24px; padding: 16px; background: #f4f4f4; }
    #primaryCta { display: block; width: 100%; padding: 16px; font-size: 18px; background: #0a7; color: #fff; border: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 id="heroTitle">This layout overflows sideways</h1>
    <div id="overflowOffender"></div>
    <div id="evidenceScreenshot" role="img" aria-label="Evidence screenshot"></div>
    <div id="personalizedVideoFrame" role="img" aria-label="Personalized video"></div>
    <section id="purchaseControls">
      <button id="primaryCta" type="button">Approve &amp; start</button>
    </section>
  </main>
</body>
</html>

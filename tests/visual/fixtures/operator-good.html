<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operator — Good</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; overflow-x: hidden; }
    .wrap { padding: 16px; max-width: 100%; }
    #heroTitle { font-size: 24px; margin: 8px 0 16px; }
    #status { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #e6f7ee; color: #0a7; font-weight: 600; }
    #evidenceScreenshot { width: 100%; max-width: 480px; aspect-ratio: 16 / 10; background: #ddd; margin-top: 16px; }
    #personalizedVideoFrame { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; background: #222; margin-top: 16px; }
    .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    #websiteButton { padding: 12px 16px; background: #123; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    #primaryCta { padding: 12px 16px; background: #0a7; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 id="heroTitle">Opportunity workspace</h1>
    <span id="status">Verified</span>
    <div id="evidenceScreenshot" role="img" aria-label="Evidence screenshot"></div>
    <div id="personalizedVideoFrame" role="img" aria-label="Personalized video"></div>
    <div class="actions">
      <button id="websiteButton" type="button">Open verified website</button>
      <button id="primaryCta" type="button">Prepare offer</button>
    </div>
  </main>
</body>
</html>

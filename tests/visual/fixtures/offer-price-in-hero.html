<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offer — Price In Hero (broken)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; overflow-x: hidden; }
    .wrap { padding: 16px; }
    .hero { padding: 8px 0 16px; }
    #heroTitle { font-size: 28px; line-height: 1.2; margin: 8px 0; }
    /* BROKEN: a price is rendered inside the hero, where price is forbidden. */
    #heroPrice { font-size: 32px; font-weight: 700; color: #b00; }
    #evidenceScreenshot { width: 100%; max-width: 480px; aspect-ratio: 16 / 10; background: #ddd; }
    #personalizedVideoFrame { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; background: #222; margin-top: 16px; }
    #purchaseControls { margin-top: 24px; padding: 16px; background: #f4f4f4; }
    #primaryCta { display: block; width: 100%; padding: 16px; font-size: 18px; background: #0a7; color: #fff; border: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1 id="heroTitle">Your booking gap, solved</h1>
      <div id="heroPrice">$1,499</div>
    </section>
    <div id="evidenceScreenshot" role="img" aria-label="Evidence screenshot"></div>
    <div id="personalizedVideoFrame" role="img" aria-label="Personalized video"></div>
    <section id="purchaseControls">
      <button id="primaryCta" type="button">Approve &amp; start</button>
    </section>
  </main>
</body>
</html>

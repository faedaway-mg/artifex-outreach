<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offer — Good</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 100%; overflow-x: hidden; }
    .wrap { width: 100%; max-width: 100%; padding: 16px; }
    #heroTitle { font-size: 28px; line-height: 1.2; margin: 8px 0 16px; }
    #evidenceScreenshot { width: 100%; max-width: 480px; aspect-ratio: 16 / 10; background: #ddd; border-radius: 8px; }
    #personalizedVideoFrame { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; background: #222; border-radius: 8px; margin-top: 16px; }
    #purchaseControls { margin-top: 24px; padding: 16px; background: #f4f4f4; border-radius: 8px; }
    #primaryCta { display: block; width: 100%; padding: 16px; font-size: 18px; background: #0a7; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    #stickyBar { position: static; margin-top: 40px; padding: 12px; background: #eee; text-align: center; z-index: 5; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 id="heroTitle">Recover the revenue your booking gap is quietly costing you</h1>
    <div id="evidenceScreenshot" role="img" aria-label="Evidence screenshot"></div>
    <div id="personalizedVideoFrame" role="img" aria-label="Personalized video"></div>
    <section id="purchaseControls">
      <p>One-time engagement. No subscription.</p>
      <button id="primaryCta" type="button">Approve &amp; start</button>
    </section>
    <div id="stickyBar">Questions? Reply to the email.</div>
  </main>
</body>
</html>
